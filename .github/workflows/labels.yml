name: Require Pull Request Labels
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
jobs:
  label:
    # Only run if PR is not from a fork
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # the release pull request from ready-release-go can't set labels itself
      - name: Label release pull request
        if: github.event.pull_request.head.ref == 'next-release/main'
        run: gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=Docs:Build&Tools"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      # reads the labels from the API, so it sees the label added above
      - uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: |
            Docs:User
            Docs:Admin
            Docs:Developer
            Docs:Breaking-Change
            Docs:Build&Tools
            Docs:Guides
          add_comment: true
